[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "fantasma"
version = "0.1.0"
description = "Synthetic price simulation with known dynamics, in the Almanac data format."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2"]

[tool.poetry]
packages = [{ include = "fantasma", from = "src" }]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
ruff = ">=0.5"
statsmodels = ">=0.14"
# For tests/test_notebooks.py, which executes every notebook.
matplotlib = ">=3.8"
nbformat = ">=5.9"
nbclient = ">=0.10"
ipykernel = ">=6.29"

# Working in the notebooks: `poetry install --with notebooks`.
[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
matplotlib = ">=3.8"
jupyterlab = ">=4"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "recovery: parameter-recovery tests (long simulations, need statsmodels)",
    "notebooks: execute every notebook in notebooks/",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
