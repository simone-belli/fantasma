[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fantasma"
version = "0.1.0"
description = "Synthetic price simulation with known dynamics, in the Almanac data format."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=1.26", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "statsmodels>=0.14", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/fantasma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["recovery: parameter-recovery tests (long simulations, need statsmodels)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
