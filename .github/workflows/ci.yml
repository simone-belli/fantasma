name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pipx install "poetry>=2.0,<3"
          poetry install

      - name: Lint
        run: |
          poetry run ruff check src tests
          poetry run ruff format --check src tests

      - name: Test
        run: poetry run pytest
